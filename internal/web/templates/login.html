{{define "content"}}
<section class="card narrow">
  <h1>{{t "Inicia la sessió"}}</h1>
  <form method="post" action="/login" class="stack">
    <label>{{t "Correu electrònic"}}
      <input type="email" name="email" required autocomplete="email" value="{{with .Data}}{{.Email}}{{end}}">
    </label>
    <label>{{t "Contrasenya"}}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">{{t "Entra"}}</button>
  </form>
  <p>{{t "No tens compte?"}} <a href="/register">{{t "Crea'n un"}}</a></p>
</section>
{{end}}
