{{define "content"}}
<section class="card narrow">
  <p><a href="/qr">← {{t "Els meus QR"}}</a></p>
  <h1>{{t "Nou QR"}}</h1>
  <form method="post" action="/qr/new" class="stack">
    <label>{{t "On ha de portar el QR?"}}
      <input type="url" name="destination" required placeholder="https://..." value="{{.Data.Destination}}" autofocus>
      <small class="muted">{{t "El podràs canviar sempre que vulguis sense reimprimir el QR."}}</small>
    </label>
    <label>{{t "Nom intern"}} <span class="muted">{{t "(opcional)"}}</span>
      <input type="text" name="name" maxlength="80" placeholder="{{t "Carta del restaurant"}}" value="{{.Data.Name}}">
    </label>
    <button type="submit">{{t "Crea el QR"}}</button>
  </form>
</section>
{{end}}
