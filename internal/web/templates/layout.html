<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · QR dinàmics</title>
<link rel="icon" href="/brand/fikua-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand/brand.css?v={{brandv}}">
<link rel="stylesheet" href="/static/app.css?v={{appv}}">
</head>
<body>
<a class="skip" href="#content">Salta al contingut</a>
<header class="top">
  <a class="brand" href="/qr"><img src="/brand/fikua-icon.svg" alt="" width="28" height="28"> QR dinàmics</a>
  {{if .Email}}
  <nav>
    <a href="/qr">Els meus QR</a>
    <a href="/compte">Compte</a>
    <span class="who">{{.Email}}</span>
    <form method="post" action="/logout"><button class="link" type="submit">Surt</button></form>
  </nav>
  {{end}}
</header>
<main id="content" tabindex="-1">
  {{if .Error}}<p class="alert error" role="alert">{{.Error}}</p>{{end}}
  {{if .Notice}}<p class="alert notice" role="status">{{.Notice}}</p>{{end}}
  {{template "content" .}}
</main>
<footer class="site-footer">
  <div class="inner">
    <span>QR dinàmics · un producte de Fikua</span>
    <nav aria-label="Textos legals">
      <a href="/legal/avis-legal">Avís legal</a>
      <a href="/legal/privacitat">Privacitat</a>
      <a href="/legal/termes">Termes</a>
      <a href="/legal/cookies">Cookies</a>
      <a href="/legal/llicencies">Llicències</a>
      <a href="mailto:{{.ContactEmail}}">{{.ContactEmail}}</a>
    </nav>
  </div>
</footer>
</body>
</html>
