sonar.organization=fikua
sonar.projectKey=fikua_qr-dinamics
sonar.projectName=qr-dinamics

sonar.sources=.
sonar.exclusions=**/*_test.go,internal/testdb/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# cmd/ only reads config and wires packages; internal/testdb is test support.
sonar.coverage.exclusions=cmd/**,internal/testdb/**
sonar.go.tests.reportPaths=test-report.json
