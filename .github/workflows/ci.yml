name: CI

# Shared workflows: fikua/fikua-ci-workflows (ADR 0018). Publishes
# fikua/qr-dinamics (both binaries) on every push to main once the tests pass;
# deploying it is a separate step (fikua-platform-iac/projects/qr-dinamics).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: fikua/fikua-ci-workflows/.github/workflows/go-ci.yml@v1
    with:
      postgres: true
      # The integration tests share one database: one package at a time.
      test-command: go test -race -p 1 -count=1 ./...
      extra-checks: |
        ./scripts/third-party-licenses.sh
        git diff --exit-code -- internal/legal/third_party_licenses.txt

  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: fikua/fikua-ci-workflows/.github/workflows/gitleaks.yml@v1

  sonar:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: fikua/fikua-ci-workflows/.github/workflows/sonar.yml@v1
    with:
      postgres: true
      coverpkg: ./internal/...
    secrets: inherit

  release:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: fikua/fikua-ci-workflows/.github/workflows/image-release.yml@v1
    with:
      image: qr-dinamics
    secrets: inherit
